[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-bench"
version = "0.0.1"
description = "Independent, reproducible benchmark of MCP scanner detection on authorization-logic vulnerabilities."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mcpbench = "mcpbench:main"

[tool.setuptools]
packages = ["mcpbench"]
