name: scan
# Runs the real scanner benchmark INSIDE the disposable GitHub Actions runner — untrusted scanners
# execute here (fresh VM, torn down after the job), never on a developer host. This is the project's
# isolation boundary.
on:
  workflow_dispatch:
  push:
    paths: ["corpus/**", "mcpbench/**", ".github/workflows/scan.yml"]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mcp-bench + scanner subjects (semgrep, bandit)
        run: pip install -e . semgrep bandit
      - name: Diagnose — does semgrep detect the obvious control bug in this runner?
        continue-on-error: true
        run: |
          semgrep --version
          echo "--- semgrep p/python on the command-injection control (verbose) ---"
          semgrep scan --config p/python corpus/command-injection/server.py; echo "exit=$?"
      - name: Install CodeQL CLI (the 3rd, independent deep-taint scanner)
        run: |
          curl -sL https://github.com/github/codeql-action/releases/latest/download/codeql-bundle-linux64.tar.gz -o /tmp/codeql.tar.gz
          tar xzf /tmp/codeql.tar.gz -C /tmp
          echo "/tmp/codeql" >> "$GITHUB_PATH"
          /tmp/codeql/codeql --version | head -1
      - name: Diagnose — does CodeQL build + detect the command-injection control?
        continue-on-error: true
        run: |
          set -x
          codeql database create /tmp/db --language=python --build-mode=none --source-root=corpus/command-injection --overwrite
          codeql database analyze /tmp/db python-security-and-quality.qls --format=sarif-latest --output=/tmp/ci.sarif --threads=2
          python3 -c "import json; d=json.load(open('/tmp/ci.sarif')); rs=d['runs'][0].get('results',[]); print('CodeQL findings on command-injection:', len(rs)); [print('  rule:', r.get('ruleId')) for r in rs]"
      - name: Run the benchmark (scanners execute in this ephemeral runner only)
        run: mcpbench | tee benchmark.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results.json
            benchmark.txt
